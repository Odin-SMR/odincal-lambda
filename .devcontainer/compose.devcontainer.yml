services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu24.04
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      - postgres
      - localstack
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: odin
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin
      # LocalStack
      LOCALSTACK_HOST: localstack
      LOCALSTACK_PORT: 4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-north-1
      AWS_ENDPOINT_URL: http://localstack:4566
    # ports:
    #   - "5432:5432"
    #   - "4566:4566"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: odin
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin
    volumes:
      # Run odincal/db/create.sql automatically when the database is first initialized
      - ../odincal/db/create.sql:/docker-entrypoint-initdb.d/10-create-odincal.sql:ro
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin -d odin"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    restart: unless-stopped
    environment:
      - SERVICES=lambda,stepfunctions
      # - EDGE_PORT=4566
      - AWS_DEFAULT_REGION=eu-north-1
      # - LS_LOG=info
      # - DEBUG=0
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d

volumes:
  localstack-data:
